name: CI

on:
  push:
    branches: [ master, main, aws-emulator-integration ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install black

      - name: Check code formatting with Black
        run: black --check kines tests

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      TZ: Asia/Kolkata
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov freezegun
          pip install -e .

      - name: Install and start AWS Emulator
        run: |
          deb=$(mktemp -d)/aws-emulator.deb
          curl -fsSLo "$deb" https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y "$deb"
          mkdir -p "$HOME/.aws/emulator/9297"
          nohup /opt/aws-emulator/bin/aws-emulator -p 9297 -t off > "$HOME/.aws/emulator/9297.log" 2>&1 &
          for i in $(seq 30); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health && echo "AWS Emulator ready" && break
            sleep 1
          done

      - name: Run unit & integration tests
        run: |
          pytest --cov=kines --cov-report=term tests/ -v

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Test Coverage (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
